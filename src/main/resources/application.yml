spring:
  application:
    name: awgment-app-account
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${AWGMENT_DB_URL:jdbc:postgresql://localhost:5432/awgment_account}
    username: ${AWGMENT_DB_USERNAME:awgment}
    password: ${AWGMENT_DB_PASSWORD:awgment_local_dev_password}
    hikari:
      maximum-pool-size: ${AWGMENT_DB_POOL_MAX:20}
      minimum-idle: ${AWGMENT_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${AWGMENT_DB_CONN_TIMEOUT_MS:9500}
      leak-detection-threshold: ${AWGMENT_DB_LEAK_THRESHOLD_MS:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${AWGMENT_FLYWAY_ENABLED:true}
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      enabled: false
    beans:
      enabled: false
    configprops:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: ${AWGMENT_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${AWGMENT_OPENAPI_ENABLED:false}

awgment:
  id-generator:
    node-id: ${AWGMENT_NODE_ID:-1}
  security:
    platform-realm: ${AWGMENT_PLATFORM_REALM:platform}
    expected-audience: ${AWGMENT_EXPECTED_AUDIENCE:awgment-account}
    trusted-client-id: ${AWGMENT_TRUSTED_CLIENT_ID:awgment-account}
    keycloak-base-url: ${AWGMENT_KEYCLOAK_URL:http://localhost:8080}
    dev-docs-enabled: ${AWGMENT_OPENAPI_ENABLED:false}
