spring:
  datasource:
    url: jdbc:h2:mem:awgment_account_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

awgment:
  security:
    platform-realm: platform
    expected-audience: awgment-account
    trusted-client-id: awgment-account
    keycloak-base-url: http://localhost:8080
    dev-docs-enabled: false
