spring:
  datasource:
    url: jdbc:h2:mem:awgment_account_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

awgment:
  multitenancy:
    enabled: false
    status-cache-ttl-seconds: 60
  flyway:
    migrate-on-startup: false
  security:
    platform-realm: platform
    expected-audience: awgment-account
    trusted-client-id: awgment-account
    keycloak-base-url: http://localhost:8080
    dev-docs-enabled: false
    service-account-clients: awgment-service-client
  keycloak:
    admin:
      server-url: http://localhost:8080
      realm: master
      client-id: admin-cli
      client-secret: ""
      username: admin
      password: admin_test_password
      connect-timeout-ms: 5000
      read-timeout-ms: 8000
  outbox:
    worker-enabled: false
    poll-interval-ms: 2000
    lease-ttl-seconds: 60
    verification-delay-seconds: 15
    sync-revoke-timeout-ms: 5000
    max-retries: 5
    batch-size: 20
    base-backoff-seconds: 5
    max-backoff-seconds: 300
    worker-id: ""
