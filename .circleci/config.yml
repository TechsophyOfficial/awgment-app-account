version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v2-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-v2-
      - run:
          name: Run unit, OWASP VAPT, contract tests & JaCoCo >= 85% coverage gate
          command: ./gradlew clean check bootJar --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v2-{{ checksum "build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - store_test_results:
          path: build/test-results/test
      - store_artifacts:
          path: build/reports/jacoco/test/html
          destination: jacoco-report

workflows:
  version: 2
  build_and_verify:
    jobs:
      - verify
